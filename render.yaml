# Configuración de despliegue en Render (Blueprint).
# Un solo servicio: compila React y luego FastAPI sirve la página y la API.
services:
  - type: web
    name: minicore-comisiones
    runtime: python
    plan: free
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/reglas
